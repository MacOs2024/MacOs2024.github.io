name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установка зависимостей
        run: npm ci

      - name: Тесты (npm test)
        run: npm test

      - name: Пересборка сайта генератором
        run: python3 generator/build.py

      - name: Проверка, что сайт пересобран и закоммичен
        run: |
          if ! git diff --quiet; then
            echo "::error::Содержимое репозитория расходится с выводом generator/build.py."
            echo "Похоже, HTML правили руками или забыли пересобрать сайт после правки generator/data_*.py."
            echo "Запустите 'python3 generator/build.py' локально и закоммитьте результат."
            echo
            git diff --stat
            exit 1
          fi
